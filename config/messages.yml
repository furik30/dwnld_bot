start: |
  🎶 <b>Welcome! I am a music and video downloader bot.</b>

  <b>How to use:</b>
  1. Send me a song name to search.
  2. Or send a link to a video from TikTok, Instagram Reels, or a playlist from YouTube/SoundCloud.

  <b>Inline mode:</b>
  Type my name (<code>@{bot_username}</code>) in any chat followed by your query or link.

  Owner: {owner_username}

help: |
  **How to use the bot:**

  🎵 **Music Search & Download:**
     - Just send me the song name (e.g., "Blinding Lights").
     - I will offer 5 options with download buttons.

  📹 **Video & Playlist Download:**
     - Send a link to a video from TikTok, Instagram Reels.
     - Send a link to a playlist from YouTube or SoundCloud.

  🤖 **Inline Mode:**
     - Type `@{bot_username}` in any chat followed by a song name or link.
     - Click the result to switch to my chat for downloading.

  **Limits:**
  - Max duration: **{max_duration} minutes**.
  - Max playlist items: **{max_playlist_items}**.

  Owner: {owner_username}

