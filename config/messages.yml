start: |
  🎶 <b>Добро пожаловать! Я бот для скачивания музыки и видео.</b>

  <b>Как пользоваться:</b>
  1. Отправьте мне название песни для поиска.
  2. Или отправьте ссылку на видео из TikTok, Instagram Reels, или плейлист с YouTube/SoundCloud.

  <b>Инлайн-режим:</b>
  Напишите мое имя (<code>@{bot_username}</code>) в любом чате, а затем ваш запрос или ссылку.

  Владелец: {owner_username}

help: |
  **Как пользоваться ботом:**

  🎵 **Поиск и скачивание музыки:**
     - Просто отправьте мне название песни (например, "Blinding Lights").
     - Я предложу 5 вариантов с кнопками для скачивания.

  📹 **Скачивание видео и плейлистов:**
     - Отправьте ссылку на видео из TikTok, Instagram Reels.
     - Отправьте ссылку на плейлист из YouTube или SoundCloud.

  🤖 **Инлайн-режим:**
     - Введите `@{bot_username}` в любом чате и через пробел название песни или ссылку.
     - Нажмите на результат, чтобы перейти ко мне в чат для скачивания файла.

  **Ограничения:**
  - Макс. длительность: **{max_duration} минут**.
  - Макс. треков в плейлисте: **{max_playlist_items}**.

  Владелец: {owner_username}

