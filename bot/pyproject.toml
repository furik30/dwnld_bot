[project]
name = "downloader-bot"
version = "1.0.0"
description = "Telegram bot for downloading videos from TikTok, YouTube and Instagram"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
    "yt-dlp[default]>=2026.7.4",
    "instaloader>=4.11",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "curl-cffi>=0.10,<0.16",
]

[tool.uv]
package = false
