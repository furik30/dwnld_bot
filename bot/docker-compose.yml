services:
  downloader_bot:
    build: .
    container_name: downloader_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
      - ./cookies/instagram_cookies.txt:/app/cookies/instagram_cookies.txt
      - ./cookies/youtube_cookies.txt:/app/cookies/youtube_cookies.txt
      - ./cookies/tiktok_cookies.txt:/app/cookies/tiktok_cookies.txt
    user: "${USER_ID}:${GROUP_ID}"
