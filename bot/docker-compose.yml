services:
  downloader_bot:
    build: .
    container_name: downloader_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
      - ./instagram_cookies.txt:/app/instagram_cookies.txt
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
      - ./tiktok_cookies.txt:/app/tiktok_cookies.txt
    user: "${USER_ID}:${GROUP_ID}"
